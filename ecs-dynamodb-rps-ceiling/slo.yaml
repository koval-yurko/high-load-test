service: ecs-dynamodb-rps-ceiling
window: 7d

# endpoint name -> route TEMPLATE as handlers.js matches it. The collector keys
# its class mapping on the template; a test cross-checks both directions, so a
# renamed route fails the build instead of silently leaving traffic unclassified.
endpoints:
  getItem: /items/:pk/:sk
  putItem: /items
  feed:    /feeds/:pk
  report:  /reports

slos:
  - name: latency-classes
    sli: class_threshold_ratio
    objective: 99.0
    tail_objective: 99.9
    tail_multiplier: 3
    classes:
      fast:     { threshold_ms: 50,  endpoints: [getItem, putItem] }
      standard: { threshold_ms: 200, endpoints: [feed] }
      heavy:    { threshold_ms: 800, endpoints: [report] }

  - name: availability
    sli: success_rate
    objective: 99.9

capacity:
  target_rps: 1000
  mix: { read: 0.55, write: 0.15, feed: 0.25, report: 0.05 }
  cost_per_request:
    read:   { rcu: 0.5, wcu: 0 }
    write:  { rcu: 0,   wcu: 1 }
    feed:   { rcu: 2.5, wcu: 0 }
    report: { rcu: 2.5, wcu: 1 }

# Attribution inputs. The route -> DynamoDB operation map is what lets in-process
# db time be compared against DynamoDB's own clock; /reports issues TWO calls, so
# its comparison is against the sum of both operations.
attribution:
  vcpu_per_task: 0.25
  operations:
    getItem: [GetItem]
    putItem: [PutItem]
    feed:    [Query]
    report:  [Query, PutItem]
